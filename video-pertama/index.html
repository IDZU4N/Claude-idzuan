<!doctype html>
<html lang="ms" data-resolution="custom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540, height=960" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 540px; height: 960px; overflow: hidden; background: #0b1020; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="540" data-height="960">
      <div
        id="ujian"
        class="clip"
        data-composition-id="ujian"
        data-composition-src="compositions/ujian.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="540"
        data-height="960"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
